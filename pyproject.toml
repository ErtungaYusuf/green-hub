[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "green-hub"
version = "0.1.0"
description = "Green Hub (GRN): wallet, compute buying and mining in one page in the browser"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["green-grn>=0.23"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
green-hub = "green_hub.hub:main"

[tool.setuptools]
packages = ["green_hub"]

[tool.setuptools.package-data]
green_hub = ["hub.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
